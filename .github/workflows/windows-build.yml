name: Windows Desktop Build

on:
  push:
    branches:
      - build/windows-exe
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-export:
    name: Export Windows x64 build
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_NOLOGO: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Godot 4.6 .NET and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.0
          use-dotnet: true
          include-templates: true

      - name: Restore and build C# project
        run: |
          dotnet restore "super mech.csproj"
          dotnet build "super mech.csproj" --configuration Release --no-restore

      - name: Import Godot resources
        run: godot --headless --editor --path . --import --quit

      - name: Rebuild after import
        run: dotnet build "super mech.csproj" --configuration Release --no-restore

      - name: Export Windows executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\dist" | Out-Null
          godot --headless --path "$env:GITHUB_WORKSPACE" --export-release "Windows Desktop" "$env:GITHUB_WORKSPACE\dist\SuperMech.exe"
          if ($LASTEXITCODE -ne 0) { throw "Godot export failed with exit code $LASTEXITCODE" }
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist\SuperMech.exe"
          if (-not (Test-Path $exe)) {
            Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter "*.exe" -Recurse | Select-Object FullName,Length
            throw "Windows export did not produce dist\SuperMech.exe"
          }
          Get-Item $exe | Select-Object FullName,Length

      - name: Package Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:GITHUB_WORKSPACE "SuperMech-Windows-x64.zip"
          Compress-Archive -Path (Join-Path $env:GITHUB_WORKSPACE "dist\*") -DestinationPath $zip -Force
          if (-not (Test-Path $zip)) { throw "ZIP package was not created" }
          Get-Item $zip | Select-Object FullName,Length

      - name: Publish downloadable prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-prototype-1
          target_commitish: ${{ github.sha }}
          name: Super Mech Windows Prototype Build 1
          prerelease: true
          generate_release_notes: true
          overwrite_files: true
          files: ${{ github.workspace }}/SuperMech-Windows-x64.zip
